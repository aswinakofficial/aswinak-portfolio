[build]
  command = "pnpm build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "24"

# Redirects for old CV links (prevents GSC 404 errors)
[[redirects]]
  from = "/cv"
  to = "/resume"
  status = 301

[[redirects]]
  from = "/cv.pdf"
  to = "/resume.pdf"
  status = 301

# Every page is prerendered, so anything without a matching file is a real 404.
# (A 200 SPA fallback here made unknown URLs serve the homepage — soft 404s in GSC.)
[[redirects]]
  from = "/*"
  to = "/404/index.html"
  status = 404

# Cache hashed assets forever
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Explicit content type for sitemaps and RSS
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml"

[[headers]]
  for = "/rss.xml"
  [headers.values]
    Content-Type = "application/xml"

# Security headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
